<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>TrackStudy Atlas</title>
  <script>
    (() => {
      try {
        const mode = localStorage.getItem('trackstudy-theme') || 'system';
        const dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.themeMode = mode;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (_) {}
    })();
  </script>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">TS</span>
      <div>
        <strong id="project-title">TrackStudy</strong>
        <span id="project-meta">Evidence-backed experiment lineage</span>
      </div>
    </div>
    <div class="controls" aria-label="Atlas controls">
      <label class="control search-control">
        <span>Search</span>
        <input id="search" type="search" placeholder="ID, title, conclusion" autocomplete="off">
      </label>
      <label class="control">
        <span>Track</span>
        <select id="track-filter"><option value="all">All tracks</option></select>
      </label>
      <button id="fit" type="button">Fit</button>
      <button id="theme" type="button" aria-label="Theme: system">Theme · Auto</button>
    </div>
  </header>

  <main class="workspace">
    <section class="graph-panel" aria-label="Experiment lineage">
      <div id="cy" tabindex="0" aria-label="Interactive experiment graph"></div>
      <div id="node-captions" aria-hidden="true"></div>
      <div class="graph-help">Click for a summary · Double-click for full details · Drag to pan</div>
      <div id="graph-status" class="graph-status" role="status"></div>
    </section>

    <aside id="summary" class="summary-panel" aria-live="polite">
      <div class="empty-state">
        <span class="eyebrow">TrackStudy</span>
        <h1>Select an experiment</h1>
        <p>Click a node to see what it tested, what changed, and what was concluded.</p>
      </div>
    </aside>
  </main>

  <dialog id="detail-dialog" class="detail-dialog">
    <form method="dialog" class="dialog-shell">
      <header class="dialog-header">
        <div>
          <span class="eyebrow">Experiment dossier</span>
          <h2 id="dialog-title">Details</h2>
        </div>
        <button value="close" aria-label="Close details">Close</button>
      </header>
      <div id="dialog-content" class="dialog-content"></div>
    </form>
  </dialog>

  <script src="data/study.js"></script>
  <script src="assets/vendor/cytoscape.min.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
